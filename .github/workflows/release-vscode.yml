name: Release VS Code

on:
  push:
    tags:
      - "vscode-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing VS Code release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish extension
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^vscode-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must use the exact vscode-vMAJOR.MINOR.PATCH form."
            exit 1
          fi

          if ! tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"; then
            echo "::error::Release tag ${tag} does not exist."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "::error::Release tag must point to a commit in the main branch history."
            exit 1
          fi

          version="$(node -p "require('./vscode/package.json').version")"
          if [[ -z "${version}" || "${tag}" != "vscode-v${version}" ]]; then
            echo "::error::Release tag ${tag} does not match extension version ${version:-<missing>}."
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        working-directory: vscode
        run: npm ci

      - name: Test, compile, and package the extension
        working-directory: vscode
        run: npm run check && npm run package

      - name: Verify release asset
        id: asset
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: .github/scripts/verify-vscode-release-asset.sh "${VERSION}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET: ${{ steps.asset.outputs.path }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${RELEASE_ASSET}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${RELEASE_ASSET}" --verify-tag --generate-notes --title "${RELEASE_TAG}"
          fi
